name: Build image test

# Builds the image on every PR and pushes it tagged with the branch name
# (e.g. stfc-mockserver-client:46-add-dynamic-users) so it can be tested with
# other repos before merging, the same way user-office-factory does it
on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: write # push the branch image to ghcr.io

jobs:
  build-image-test:
    name: Docker build and file validation
    runs-on: ubuntu-latest
    env:
      # Dependabot and fork PRs get a read-only token, so only build for those
      PUSH_IMAGE: ${{ github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'dependabot') }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          call: check

      - name: Login to GitHub Container Registry
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push branch image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: BUILD_VERSION=${{ github.event.pull_request.head.sha }}
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ghcr.io/userofficeproject/stfc-mockserver-client:${{ github.head_ref }}
