name: Build && Push

# On every merge into master: bump the version from the conventional commit
# messages, publish a GitHub Release, then build and push the image tagged with
# that version
on:
  push:
    branches: [master]

permissions:
  contents: write # create tags and releases
  packages: write # push to ghcr.io

# Run one release at a time so two quick merges can't claim the same version
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # feat -> minor, fix -> patch, ! or BREAKING CHANGE -> major, anything else -> patch
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create a GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          build-args: BUILD_VERSION=${{ steps.tag_version.outputs.new_tag }}
          push: true
          tags: |
            ghcr.io/userofficeproject/stfc-mockserver-client:${{ steps.tag_version.outputs.new_tag }}
            ghcr.io/userofficeproject/stfc-mockserver-client:latest
